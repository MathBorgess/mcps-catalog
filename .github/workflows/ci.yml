name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.11"
          - os: ubuntu-24.04
            python-version: "3.12"
          - os: macos-14
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install and test the speak package
        run: cd speak && pip install -e . pytest && pytest -q -rs

  laya-computer-unit:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install portable test dependencies (no model or native driver)
        run: pip install "mcp==2.2.0" "pydantic>=2.12,<3" "pytest>=8,<9" && pip install --no-deps -e ./laya-computer
      - name: install the Cua Driver SDK where its embedded runtime is safe to exercise (Linux only)
        if: runner.os == 'Linux'
        run: pip install "cua-driver==0.31.0"
      - name: test controller and contracts with synthetic fixtures
        run: cd laya-computer && python -m pytest -q -rs

  pins:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ultrafast-browser pinned sha matches the submodule commit
        run: python3 scripts/check_pins.py
      - name: root test suite (exercises check_pins.py itself)
        run: pip install -q pytest && python3 -m pytest -q -rs

  cloud-platform-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: retired Linux setup remains a non-mutating no-op
        run: bash -n cloud/setup.sh && bash cloud/setup.sh
