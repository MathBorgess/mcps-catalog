[project]
name = "laya-computer-mcp"
version = "0.1.0"
description = "Execute planned desktop tasks with local Laya decisions and Cua Driver."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp==2.2.0",
    "cua-driver==0.31.0",
    "pydantic>=2.12,<3",
    "laya-mlx>=0.1,<0.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
laya-computer-mcp = "laya_computer.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["laya_computer"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "laya_computer/**/*.py" }]
