[project]
name = "speak-mcp"
version = "0.1.0"
description = "Text-to-speech MCP server: Kokoro TTS locally, Telegram voice messages from cloud sessions."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "kokoro-onnx==0.6.1",
    "onnxruntime==1.30.0",
    "soundfile==0.14.0",
    "mcp==2.2.0",
    "httpx==0.28.1",
]

[project.scripts]
speak-mcp = "speak_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["speak_mcp"]
