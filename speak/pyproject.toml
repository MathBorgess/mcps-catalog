[project]
name = "speak-mcp"
version = "0.2.0"
description = "Text-to-speech MCP server: Qwen3-TTS 1.7B MLX 4-bit on Apple Silicon, local playback or Telegram."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mlx-audio==0.5.8; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy>=1.26.4",
    "huggingface-hub==2.2.0",
    "soundfile==0.14.0",
    "mcp==2.2.0",
    "httpx==0.28.1",
    "pydantic>=2.12",
]

[project.scripts]
speak-mcp = "speak_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["speak_mcp"]

[tool.uv]
# uv caches a local-directory build (`uvx --from ${CLAUDE_PLUGIN_ROOT} speak-mcp`, as used by
# speak/.claude-plugin/plugin.json) keyed only by pyproject.toml by default, so editing
# speak_mcp/*.py without touching this file left the plugin running stale code from a prior
# build. Widen the cache key to the package sources too.
cache-keys = [{ file = "pyproject.toml" }, { file = "speak_mcp/**/*.py" }]
